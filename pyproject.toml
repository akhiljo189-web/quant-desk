[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-desk"
version = "0.1.0"
description = "Evidence-driven autonomous equities trading with a hard go-live gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
live = ["requests>=2.31.0"]

[project.scripts]
qd = "qd.cli:main"

[tool.setuptools]
packages = ["qd", "qd.features", "qd.providers", "research"]
